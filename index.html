<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physik Grundwissen – Üben</title>

     bearbeiten - die Vorlage steht in _Vorlagen/Web/. -->
<style>
:root{
  --grund:#fbfaf8; --karte:#ffffff; --text:#1c1b1a; --leise:#6b6864;
  --linie:#e3dfd9; --akzent:#2E75B6; --gut:#2f7d32; --nochmal:#b8541c;
  --schatten:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --rund:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --grund:#17181a; --karte:#212327; --text:#e9e7e4; --leise:#9b9793;
    --linie:#33363b; --schatten:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }
  .farbton{filter:brightness(1.75) saturate(.85);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; padding:0; background:var(--grund); color:var(--text);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.huelle{max-width:44rem; margin:0 auto; padding:0 16px 3rem;}

/* ------------------------------------------------------------ Kopf */
header{padding-block:1.6rem .4rem;}
h1{font-size:1.35rem; line-height:1.25; margin:0; letter-spacing:-.01em;}
header p{margin:.35rem 0 0; color:var(--leise); font-size:.9rem;}

/* -------------------------------------------------------- Auswahl */
.jahrgang{margin-top:1.75rem;}
.jahrgang > h2{
  font-size:.8rem; text-transform:uppercase; letter-spacing:.08em;
  color:var(--leise); margin:0 0 .6rem; font-weight:600;
}
.kapitelliste{display:grid; gap:.5rem;}
.kapitel{
  display:flex; align-items:center; gap:.75rem; padding:.7rem .9rem;
  background:var(--karte); border:1px solid var(--linie); border-radius:var(--rund);
  cursor:pointer; box-shadow:var(--schatten); transition:border-color .12s, transform .06s;
}
.kapitel:active{transform:scale(.995)}
.kapitel.an{border-color:var(--text);}
.kapitel input{position:absolute; opacity:0; pointer-events:none;}
.punkt{
  width:.95rem; height:.95rem; border-radius:50%; flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.kapitel .name{flex:1 1 auto; font-weight:600;}
.kapitel .zahl{color:var(--leise); font-size:.85rem; font-variant-numeric:tabular-nums;}
.haken{
  width:1.25rem; height:1.25rem; border-radius:6px; flex:0 0 auto;
  border:1.5px solid var(--linie); display:grid; place-items:center;
  font-size:.8rem; color:transparent;
}
.kapitel.an .haken{background:var(--text); border-color:var(--text); color:var(--grund);}

.schnell{display:flex; gap:.5rem; margin:.9rem 0 0;}
.schnell button{
  background:none; border:1px solid var(--linie); color:var(--leise);
  border-radius:99px; padding:.25rem .8rem; font-size:.82rem; cursor:pointer; font-family:inherit;
}
.schnell button:hover{color:var(--text); border-color:var(--text);}

.starten{margin-top:2rem; display:grid; gap:.6rem;}
button.gross{
  width:100%; padding:.95rem 1.1rem; border-radius:var(--rund); cursor:pointer;
  border:1px solid var(--text); background:var(--text); color:var(--grund);
  font:600 1rem/1.3 inherit; text-align:left; display:flex; justify-content:space-between; gap:1rem;
}
button.gross.zweit{background:var(--karte); color:var(--text); border-color:var(--linie);}
button.gross:disabled{opacity:.4; cursor:not-allowed;}
button.gross .neben{font-weight:400; color:inherit; opacity:.7; font-variant-numeric:tabular-nums;}

/* --------------------------------------------------------- Übung */
.leiste{display:flex; align-items:center; gap:.9rem; padding-block:1.1rem .9rem;}
.leiste button{
  background:none; border:0; color:var(--leise); font:inherit; font-size:.9rem;
  cursor:pointer; padding:0; display:flex; align-items:center; gap:.35rem;
}
.leiste button:hover{color:var(--text)}
.rest{margin-left:auto; color:var(--leise); font-size:.85rem; font-variant-numeric:tabular-nums;}
.balken{height:3px; background:var(--linie); border-radius:99px; overflow:hidden;}
.balken > i{display:block; height:100%; background:var(--text); width:0; transition:width .25s;}

.karte{
  background:var(--karte); border:1px solid var(--linie); border-radius:var(--rund);
  box-shadow:var(--schatten); margin-top:1rem; overflow:hidden;
}
.karte > .band{height:4px;}
.karte > .inhalt{padding:1.4rem 1.25rem 1.5rem;}
.herkunft{
  font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; font-weight:600;
  margin:0 0 .8rem;
}
.kann{
  margin:0 0 1rem; padding:.6rem .8rem; border-radius:9px; font-size:.9rem;
  background:color-mix(in srgb, var(--leise) 9%, transparent); color:var(--leise);
}
.frage{margin:0; font-size:1.15rem; line-height:1.9; overflow-x:auto; padding:.3em 0;}
.antwort{
  margin:1.25rem 0 0; padding-top:1.15rem; border-top:1px solid var(--linie);
  font-size:1.05rem; line-height:1.7;
}
.frage img,.antwort img{
  max-width:100%; height:auto; display:block; margin:.7rem 0;
  border-radius:6px; background:#fff;
}
.weg{color:var(--leise); font-size:.92rem; margin:0 0 .7rem;}
.ergebnis{margin:0; line-height:2; overflow-x:auto; padding:.35em 0;}

.knoepfe{display:grid; gap:.6rem; margin-top:1.1rem;}
.knoepfe.zwei{grid-template-columns:1fr 1fr;}
.knoepfe button{
  padding:.85rem 1rem; border-radius:var(--rund); cursor:pointer; font:600 .98rem/1.3 inherit;
  border:1px solid var(--linie); background:var(--karte); color:var(--text);
}
.knoepfe button.auf{background:var(--text); color:var(--grund); border-color:var(--text);}
.knoepfe button.gut{border-color:var(--gut); color:var(--gut);}
.knoepfe button.neu{border-color:var(--nochmal); color:var(--nochmal);}
.knoepfe .taste{display:block; font-weight:400; font-size:.72rem; opacity:.6; margin-top:.15rem;}
@media (hover:none){ .knoepfe .taste{display:none} }

/* --------------------------------------------------------- Schluss */
.schluss{text-align:center; padding:3rem 1rem;}
.schluss .zeichen{font-size:2.5rem; line-height:1;}
.schluss h2{font-size:1.2rem; margin:.8rem 0 .4rem;}
.schluss p{color:var(--leise); margin:0 0 1.5rem;}

/* ---------------------------------------------------------- Fuß */
footer{
  border-top:1px solid var(--linie); margin-top:3rem; padding-top:1.1rem;
  color:var(--leise); font-size:.8rem; line-height:1.6;
}
footer button{
  background:none; border:0; color:var(--leise); font:inherit; text-decoration:underline;
  cursor:pointer; padding:0;
}
footer button:hover{color:var(--text)}

/* -------------------------------------------------------- Formeln */
.mf{
  font-family:"Cambria Math","Latin Modern Math","STIX Two Math","Times New Roman",serif;
  font-style:italic; line-height:1;
  /* Eine Rechnung bricht nicht um. Was nicht in die Zeile passt, lässt der
     Container scrollen – ein Umbruch mitten in '4,0 · 10⁵ Ω = 400 kΩ' wäre
     schlechter zu lesen als eine breite Zeile. */
  white-space:nowrap;
}
.mf.ik{padding-right:.07em;}                    /* Kursivkorrektur */
.dopp{                                          /* das Ergebnis */
  /* Rahmen statt 'text-decoration': Die Dekoration setzt an jeder Spanne neu
     an und überspringt die Abstände um '=' und '·' - der Doppelstrich zerfiele
     in Stücke. Als Rahmen des umschließenden Kastens zieht er durch. */
  display:inline-block; border-bottom:3px double currentColor;
  padding-bottom:.12em; line-height:1.25;
}
.mf .up{font-style:normal;}
.mf .vor{font-style:normal;}                    /* Vorzeichen: keine Luft */
.mf .bin{font-style:normal; margin:0 .19em;}    /* Rechenzeichen */
.mf .rel{font-style:normal; margin:0 .27em;}    /* Relation: etwas mehr */
.mf sup,.mf sub{font-size:.72em; line-height:0;}
.frac{
  display:inline-block; vertical-align:middle; text-align:center;
  margin:0 .14em; line-height:1.25; font-size:.98em;
}
.frac > span{display:block; padding:0 .2em;}
.frac > .z{border-bottom:1px solid currentColor;}
.frac .frac{font-size:.9em;}
.wz{display:inline-flex; align-items:flex-end; vertical-align:middle; line-height:1.25;}
.wz > .zeichen{
  font-style:normal; display:inline-block; transform-origin:bottom center;
  margin-right:-.04em;
}
.wz.hoch > .zeichen{transform:scaleY(2.2);}
.wz > .rad{border-top:1px solid currentColor; padding:.12em .15em 0 .08em;}
.vek{display:inline-block; position:relative;}
.vek::after{
  content:"→"; position:absolute; left:0; right:0; top:-.68em;
  font-size:.6em; font-style:normal; text-align:center; line-height:1;
}
</style>
</head>

s=\"frac\"><span class=\"z\"><span class=\"up\">1</span></span><span class=\"n\"><span class=\"up\">1000</span></span></span></span>)<br><span class=\"mf ik\">k</span> = kilo = ein Tausend (<span class=\"mf\"><span class=\"up\">1000</span></span>)"},"GW-Ph07-04":{"f":"Wie berechnest du die Dichte?","a":"<span class=\"mf\">ρ<span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">V</span></span></span>⁠, also Masse durch Volumen<br>umgestellt <span class=\"mf ik\">m<span class=\"rel\">=</span>ρ<span class=\"bin\">·</span>V</span> und <span class=\"mf\">V<span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">ρ</span></span></span>"},"GW-Ph07-25":{"f":"Was sagt die Dichte über einen Stoff aus?","a":"Jeder Stoff hat eine bestimmte Dichte. Sie ist immer gleich – egal, wie groß oder klein der Körper ist."},"GW-Ph07-06":{"f":"Was geschieht mit weißem Licht an einem Prisma?","a":"Es wird in Spektralfarben (rot, orange, gelb, grün, blau, lila) aufgeteilt."},"GW-Ph07-07":{"f":"Warum siehst du einen Gegenstand, der nicht selbst leuchtet?","a":"Weil er Licht reflektiert."},"GW-Ph07-05":{"f":"Wie breitet sich Licht aus?","a":"Geradlinig."},"GW-Ph07-08":{"f":"Was ist der Kernschatten?","a":"Der Bereich, in dem <strong>kein</strong> Licht auftrifft."},"GW-Ph07-09":{"f":"Was ist der Halbschatten?","a":"Der Bereich, in dem von <strong>manchen</strong> Lichtquellen kein Licht auftrifft."},"GW-Ph07-10":{"f":"Nenne die Planeten in ihrer Reihenfolge.","a":"Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus, Neptun – „<strong>M</strong>ein <strong>V</strong>ater <strong>e</strong>rklärt <strong>m</strong>ir <strong>j</strong>eden <strong>S</strong>amstag <strong>u</strong>nseren <strong>N</strong>achthimmel.&quot;"},"GW-Ph07-11":{"f":"Wie lange braucht die Erde für eine Drehung um sich selbst und für einen Umlauf um die Sonne?","a":"Die Erde dreht sich in 24 Stunden einmal um sich selbst und umläuft die Sonne in 365,25 Tagen."},"GW-Ph07-13":{"f":"Wie heißen die negativ, die positiv und die elektrisch neutral geladenen Teilchen?","a":"<strong>Elektronen</strong> (negativ), <strong>Protonen</strong> (positiv), <strong>Neutronen</strong> (neutral)"},"GW-Ph07-14":{"f":"Wann stoßen sich zwei Teilchen ab, wann ziehen sie sich an?","a":"Gleichnamige Ladungen stoßen sich ab, ungleichnamige ziehen sich an."},"GW-Ph07-15":{"f":"Beschreibe das Kern-Hülle-Modell.","a":"Kern aus Protonen und Neutronen, Hülle aus Elektronen. Ein Atom ist insgesamt neutral geladen."},"GW-Ph07-23":{"f":"Was geschieht beim Aufladen durch Reiben?","a":"Elektronen wandern von einem Körper auf den anderen. Wer Elektronen abgibt, wird positiv, wer sie aufnimmt, negativ – zusammen bleibt die Ladung gleich."},"GW-Ph07-16":{"f":"Wann fließt in einem Stromkreis Strom?","a":"Nur wenn der Stromkreis geschlossen ist."},"GW-Ph07-17":{"f":"Was ist ein Kurzschluss?","a":"Der Strom fließt ohne Widerstand direkt zwischen den Polen der Spannungsquelle."},"GW-Ph07-18":{"f":"Wie zeichnest du einen Schaltplan?","a":"eckig, gerade Linien und rechte Winkel, die Bauteile als genormte Schaltsymbole."},"GW-Ph07-26":{"f":"Zeichne die Schaltsymbole für Leiter, Schalter, Batterie und Glühlampe.","a":"<svg style=\"width:8.5cm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1120\" height=\"300\" viewBox=\"0 0 1120 300\"><rect width=\"1120\" height=\"300\" fill=\"#FFFFFF\"/><g stroke=\"#000000\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"><line x1=\"20\" y1=\"130\" x2=\"260\" y2=\"130\"/><text x=\"140\" y=\"245\" font-size=\"40\" text-anchor=\"middle\" stroke=\"none\" fill=\"#000000\" font-family=\"Carlito, Calibri, sans-serif\" textLength=\"92.8\" lengthAdjust=\"spacingAndGlyphs\">Leiter</text><line x1=\"300\" y1=\"130\" x2=\"355\" y2=\"130\"/><line x1=\"485\" y1=\"130\" x2=\"540\" y2=\"130\"/><line x1=\"355\" y1=\"130\" x2=\"493\" y2=\"72\"/><circle cx=\"355\" cy=\"130\" r=\"9\" fill=\"#FFFFFF\"/>< elektrischen Stroms.","a":"Magnetwirkung, Leuchtwirkung, Wärmewirkung"},"GW-Ph08-01":{"f":"Nenne die Vorsilben von Nano bis Giga mit Symbol und Zehnerpotenz.","a":"n <span class=\"mf ik\"><span class=\"up\">10</span><sup><span class=\"vor\">−</span><span class=\"up\">9</span></sup></span> · µ <span class=\"mf ik\"><span class=\"up\">10</span><sup><span class=\"vor\">−</span><span class=\"up\">6</span></sup></span> · m <span class=\"mf ik\"><span class=\"up\">10</span><sup><span class=\"vor\">−</span><span class=\"up\">3</span></sup></span> · k <span class=\"mf ik\"><span class=\"up\">10</span><sup><span class=\"up\">3</span></sup></span> · M <span class=\"mf ik\"><span class=\"up\">10</span><sup><span class=\"up\">6</span></sup></span> · G <span class=\"mf\"><span class=\"up\">10</span><sup><span class=\"up\">9</span></sup></span>"},"GW-Ph08-02":{"f":"Was sind gültige Ziffern, und auf wie viele rundest du ein Ergebnis?","a":"Alle Ziffern ab der ersten, die nicht 0 ist. Gerundet wird auf so viele gültige Ziffern wie die <strong>ungenaueste</strong> Angabe hat."},"GW-Ph08-03":{"f":"Gib Formelzeichen, Einheit und Bedeutung der <strong>Spannung</strong> an.","a":"<span class=\"mf\">U</span>⁠, Volt (V) – elektrischer Druckunterschied, Antrieb der Elektronenströmung; die Energie je Ladung"},"GW-Ph08-04":{"f":"Gib Formelzeichen, Einheit und Bedeutung der <strong>Stromstärke</strong> an.","a":"<span class=\"mf\">I</span>⁠, Ampère (A) – Anzahl der Elektronen pro Sekunde"},"GW-Ph08-05":{"f":"Gib Formelzeichen, Einheit und Bedeutung des <strong>Widerstands</strong> an.","a":"<span class=\"mf\">R</span>⁠, Ohm (<span class=\"mf\">Ω</span>) – Stärke der Hemmung (= Behinderung)"},"GW-Ph08-10":{"f":"Wie hängen Spannung, Stromstärke und Widerstand zusammen?","a":"<span class=\"mf\">U<span class=\"rel\">=</span>R<span class=\"bin\">·</span>I</span>⁠, also <span class=\"mf ik\">R<span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\">U</span><span class=\"n\">I</span></span></span> und <span class=\"mf\">I<span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\">U</span><span class=\"n\">R</span></span></span>"},"GW-Ph08-40":{"f":"Worin unterscheiden sich technische Stromrichtung und Elektronenbewegung?","a":"Die technische Stromrichtung zeigt von <strong>Plus nach Minus</strong> – eine historische Festlegung. Die Elektronen bewegen sich im Metall tatsächlich von <strong>Minus nach Plus</strong>, also entgegengesetzt."},"GW-Ph08-43":{"f":"Was ist Wechselspannung?","a":"Eine Spannung, die regelmäßig ihr <strong>Vorzeichen (Plus und Minus)</strong> ändert."},"GW-Ph08-11":{"f":"Zeichne die Schaltsymbole für Leiter, Schalter, Batterie, Glühlampe, Widerstand, Spannungsquelle, Amperemeter und Voltmeter.","a":"<svg style=\"width:8.5cm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1120\" height=\"600\" viewBox=\"0 0 1120 600\"><rect width=\"1120\" height=\"600\" fill=\"#FFFFFF\"/><g stroke=\"#000000\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"><line x1=\"20\" y1=\"130\" x2=\"260\" y2=\"130\"/><text x=\"140\" y=\"245\" font-size=\"40\" text-anchor=\"middle\" stroke=\"none\" fill=\"#000000\" font-family=\"Carlito, Calibri, sans-serif\" textLength=\"92.8\" lengthAdjust=\"spacingAndGlyphs\">Leiter</text><line x1=\"300\" y1=\"130\" x2=\"355\" y2=\"130\"/><line x1=\"485\" y1=\"130\" x2=\"540\" y2=\"130\"/><line x1=\"355\" y1=\"130\" x2=\"493\" y2=\"72\"/><circle cx=\"355\" cy=\"130\" r=\"9\" fill=\"#FFFFFF\"/><circle cx=\"485\" cy=\"130\" r=\"9\" fill=\"#FFFFFF\"/><text x=\"420\" y=\"245\" font-size=\"40\" text-anchor=\"middle\" stroke=\"none\" fill=\"#000000\" font-family=\"Carlito, Calibri, sans-serif\" textLength=\"131.5\" lengthAdjust=\"spacingAndGlyphs\">Schalter</text><line x1=\"580\" y1=\"130\" x2=\"684\" y2=\"130\"/><line x1=\"716\" y1=\"130\" x2=\"820\" y2=\"130\"/><line x1=\"684\" y1=\"78\" x2=\"684\" y2=\"182\"/><line x1=\"716\" y1=\"104\" x2=\"716\" y2=\"156\" stroke-width=\"14\"/><tex  Die Spannung teilt sich auf: <span class=\"mf\">U<sub>ges</sub><span class=\"rel\">=</span>U<sub><span class=\"up\">1</span></sub><span class=\"bin\">+</span>U<sub><span class=\"up\">2</span></sub></span>⁠. Die Widerstände addieren sich: <span class=\"mf\">R<sub>ges</sub><span class=\"rel\">=</span>R<sub><span class=\"up\">1</span></sub><span class=\"bin\">+</span>R<sub><span class=\"up\">2</span></sub></span>⁠."},"GW-Ph08-13":{"f":"Was kennzeichnet eine Parallelschaltung?","a":"Die Verbraucher liegen nebeneinander, in getrennten Zweigen."},"GW-Ph08-39":{"f":"Wie verhalten sich Spannung, Stromstärke und Widerstand in einer <strong>Parallelschaltung</strong>?","a":"An allen Zweigen liegt dieselbe Spannung. Die Stromstärke teilt sich auf: <span class=\"mf\">I<sub>ges</sub><span class=\"rel\">=</span>I<sub><span class=\"up\">1</span></sub><span class=\"bin\">+</span>I<sub><span class=\"up\">2</span></sub></span>⁠. Der Gesamtwiderstand ist kleiner als der kleinste Einzelwiderstand."},"GW-Ph08-26":{"f":"Was ist Reflexion?","a":"Das Zurückwerfen von Licht an der Grenzfläche zwischen zwei Medien."},"GW-Ph08-27":{"f":"Gib das Reflexionsgesetz an.","a":"Einfallswinkel = Reflexionswinkel"},"GW-Ph08-28":{"f":"Was ist Streuung, und wo tritt sie auf?","a":"Reflexion von Licht in verschiedene Richtungen – an unebenen Oberflächen."},"GW-Ph08-29":{"f":"Was ist Brechung?","a":"Die Änderung der Ausbreitungsrichtung von Licht an der Grenzfläche zwischen zwei Medien."},"GW-Ph08-30":{"f":"Was ist Totalreflexion?","a":"Vollständige Reflexion an der Grenzfläche – es findet keine Brechung statt."},"GW-Ph08-31":{"f":"Welche zwei Linsenarten gibt es, und wie wirken sie?","a":"Sammellinse (konvex) bündelt das Licht · Zerstreuungslinse (konkav) lässt die Strahlen dahinter auseinanderlaufen."},"GW-Ph08-34":{"f":"Was ist der Brennpunkt?","a":"Der Punkt, in dem alle vor der Linse parallelen Strahlen hinter der Linse zusammentreffen."},"GW-Ph08-35":{"f":"Was ist der Bildpunkt?","a":"Der Punkt, in dem alle von einem Gegenstandspunkt ausgehenden Strahlen hinter der Linse zusammentreffen."},"GW-Ph08-32":{"f":"Beschreibe das Bild an einer Sammellinse.","a":"Es entsteht auf der <strong>anderen</strong> Seite der Linse, steht verkehrt herum und lässt sich auf einem Schirm auffangen."},"GW-Ph08-33":{"f":"Beschreibe das Bild an einer Zerstreuungslinse.","a":"Es entsteht auf der <strong>gleichen</strong> Seite wie der Gegenstand, ist aufrecht und virtuell – nicht auffangbar."},"GW-Ph08-06":{"f":"Gib Formelzeichen, Einheit und Bedeutung der <strong>Geschwindigkeit</strong> an.","a":"<span class=\"mf\">v</span>⁠, <span class=\"mf\"><span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">s</span></span></span>⁠, zurückgelegte Strecke pro Zeitdauer"},"GW-Ph08-36":{"f":"Wie berechnest du die Geschwindigkeit?","a":"<span class=\"mf\">v<span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\">Δs</span><span class=\"n\">Δt</span></span></span>⁠, also Weg durch Zeit"},"GW-Ph08-16":{"f":"Wie rechnest du <span class=\"mf ik\"><span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">s</span></span></span> in <span class=\"mf ik\"><span class=\"frac\"><span class=\"z\">km</span><span class=\"n\">h</span></span></span> um und zurück?","a":"Von <span class=\"mf ik\"><span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">s</span></span></span> in <span class=\"mf\"><span class=\"frac\"><span class=\"z\">km</span><span class=\"n\">h</span></span></span>⁠: mal <span class=\"mf ik\"><span class=\"up\">3</span><span class=\"up\">,</span><span class=\"up\">6</span></span><br>Von <span class=\"mf ik\"><span class=\"frac\"><span class=\"z\">km</span><span class=\"n\">h</span></span></span> in <span class=\"mf\"><span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">s</span></span></span>⁠: durch <span class=\"mf\"><span class=\"up\">3</span><span class=\"up\">,</span><span class=\"up\">6</span></span>"},"GW-Ph08-15":{"f":"Worin unterscheiden sich Tempo und Geschwindigkeit?","a":"Geschwindigkeit = Tempo + Richtung. Sie ist vektoriell und wird als Pfeil gezeichnet – die Länge entspricht dem Tempo."},"GW-Ph08-17":{"f":"Wie hängen Anfangs-, Zusatz- und Endgeschwindigkeit zusammen?","a":"<span class=\"mf\"><span class=\"vek\">v</span><sub>A</sub><span class=\"bin\">+</span>Δ<span class=\"vek\">v</span><span class=\"rel\">=</span><span class=\"vek\">v</span><sub>E</sub></span>⁠, vektoriell addiert<br><svg style=\"width:4.5cm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" width=\"560\" height=\"470\" viewBox=\"0 0 560 470\"><rect width=\"560\" height=\"470\" fill=\"#FFFFFF\"/><line x1=\"95\" y1=\"355\" x2=\"396.0\" y2=\"355.0\" stroke=\"#4472C4\" stroke-width=\"9\" stroke-linecap=\"round\"/><polygon points=\"430,355 396.0,370.0 396.0,340.0\" fill=\"#4472C4\"/><line x1=\"95\" y1=\"355\" x2=\"95.0\" y2=\"129.0\" stroke=\"#C55A11\" stroke-width=\"9\" stroke-linecap=\"round\"/><polygon points=\"95,95 110.0,129.0 80.0,129.0\" fill=\"#C55A11\"/><line x1=\"430\" y1=\"355\" x2=\"121.9\" y2=\"115.8\" stroke=\"#538135\" stroke-width=\"9\" stroke-linecap=\"round\"/><polygon points=\"95,95 131.1,104.0 112.7,127.7\" fill=\"#538135\"/><circle cx=\"95\" cy=\"355\" r=\"13\" fill=\"#000000\"/><line x1=\"239\" y1=\"382\" x2=\"269\" y2=\"382\" stroke=\"#4472C4\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"275,382 267,377 267,387\" fill=\"#4472C4\"/><text x=\"255\" y=\"428\" font-size=\"44\" fill=\"#4472C4\" font-family=\"Carlito, Calibri, sans-serif\" font-style=\"italic\" text-anchor=\"middle\" textLength=\"45.3\" lengthAdjust=\"spacingAndGlyphs\">v<tspan font-size=\"30\" dy=\"12\">A</tspan></text><line x1=\"29\" y1=\"189\" x2=\"59\" y2=\"189\" stroke=\"#C55A11\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"65,189 57,184 57,194\" fill=\"#C55A11\"/><text x=\"45\" y=\"235\" font-size=\"44\" fill=\"#C55A11\" font-family=\"Carlito, Calibri, sans-serif\" font-style=\"italic\" text-anchor=\"middle\" textLength=\"41.4\" lengthAdjust=\"spacingAndGlyphs\">v<tspan font-size=\"30\" dy=\"12\">E</tspan></text><line x1=\"304\" y1=\"149\" x2=\"334\" y2=\"149\" stroke=\"#538135\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"340,149 332,144 332,154\" fill=\"#538135\"/><text x=\"320\" y=\"195\" font-size=\"44\" fill=\"#538135\" font-family=\"Carlito, Calibri, sans-serif\" font-style=\"italic\" text-anchor=\"middle\" textLength=\"150.5\" lengthAdjust=\"spacingAndGlyphs\">&#916;v</text></svg>"},"GW-Ph08-07":{"f":"Gib Formelzeichen, Einheit und Bedeutung der <strong>Kraft</strong> an.","a":"<span class=\"mf\">F</span>⁠, Newton (N) – Einwirkung"},"GW-Ph08-09":{"f":"Welche Größen sind vektoriell, und was heißt das?","a":"<span class=\"mf\">v</span>⁠, <span class=\"mf ik\">a</span> und <span class=\"mf\">F</span>⁠: Sie haben zusätzlich eine Richtung und werden als Pfeil gezeichnet."},"GW-Ph08-18":{"f":"Gib die Newtonsche Bewegungsgleichung an.","a":"<span class=\"mf\">F<span class=\"bin\">·</span>Δt<span class=\"rel\">=</span>m<span class=\"bin\">·</span>Δv</span>"},"GW-Ph08-08":{"f":"Gib Formelzeichen, Einheit und Bedeutung der <strong>Beschleunigung</strong> an.","a":"<span class=\"mf\">a</span>⁠, <span class=\"mf\"><span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">s<sup><span class=\"up\">2</span></sup></span></span></span>⁠, Geschwindigkeitsänderung pro Zeit"},"GW-Ph08-37":{"f":"Wie berechnest du die Beschleunigung?","a":"<span class=\"mf\">a<span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\">Δv</span><span class=\"n\">Δt</span></span></span>⁠, also Geschwindigkeitsänderung durch Zeit"},"GW-Ph08-19":{"f":"Formuliere Newton 1 (Trägheitsgesetz).","a":"Ohne äußere Kraftwirkung bleibt ein Körper in Ruhe oder behält seine Geschwindigkeit bei. Er ist träge."},"GW-Ph08-20":{"f":"Formuliere Newton 2 (Grundgesetz).","a":"<span class=\"mf\">F<span class=\"rel\">=</span>m<span class=\"bin\">·</span>a</span>"},"GW-Ph08-21":{"f":"Formuliere Newton 3 (Wechselwirkungsgesetz).","a":"Übt ein Körper auf einen zweiten eine Kraft aus, so wirkt auch auf ihn eine Kraft – gleich groß, entgegengesetzt: <span class=\"mf\"><span class=\"vek\">F</span><sub><span class=\"up\">1</span></sub><span class=\"rel\">=</span><span class=\"vor\">−</span><span class=\"vek\">F</span><sub><span class=\"up\">2</span></sub></span>⁠, „actio gegengleich reactio&quot;."},"GW-Ph08-22":{"f":"Was ist die Gewichtskraft, und wie berechnest du sie?","a":"Die Kraft, mit der ein Körper aufgrund seiner Masse angezogen wird: <span class=\"mf\">F<sub>G</sub><span class=\"rel\">=</span>m<span class=\"bin\">·</span>g</span>"},"GW-Ph08-23":{"f":"Ändert sich die Masse eines Körpers auf dem Mond im Vergleich zur Erde?","a":"Die Masse ist auf allen Himmelskörpern gleich – nur die Gewichtskraft ändert sich."},"GW-Ph08-41":{"f":"Was ist der freie Fall?","a":"Eine Bewegung unter dem alleinigen Einfluss der Gewichtskraft – der Luftwiderstand wird vernachlässigt."},"GW-Ph08-42":{"f":"Welchen Wert hat die Fallbeschleunigung auf der Erde? Wie ändert sie sich für Körper mit größerer Masse?","a":"Sie beträgt <span class=\"mf\">g<span class=\"rel\">=</span><span class=\"up\">9</span><span class=\"up\">,</span><span class=\"up\">81</span> <span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">s<sup><span class=\"up\">2</span></sup></span></span></span>⁠. Die Geschwindigkeit eines frei fallenden Körpers nimmt jede Sekunde um <span class=\"mf ik\"><span class=\"up\">9</span><span class=\"up\">,</span><span class=\"up\">81</span> <span class=\"frac\"><span class=\"z\">m</span><span class=\"n\">s</span></span></span> zu. Sie ist für <strong>alle</strong> Körper gleich, unabhängig von der Masse."},"GW-Ph08-24":{"f":"Wie bestimmst du zu zwei Kräften die resultierende Kraft?","a":"Über das <strong>Kräfteparallelogramm</strong>: <span class=\"mf ik\"><span class=\"vek\">F</span><sub><span class=\"up\">1</span></sub></span> und <span class=\"mf ik\"><span class=\"vek\">F</span><sub><span class=\"up\">2</span></sub></span> aufspannen, <span class=\"mf ik\"><span class=\"vek\">F</span><sub>res</sub></span> ist die Diagonale.<br><svg style=\"width:4.5cm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" width=\"620\" height=\"440\" viewBox=\"0 0 620 440\"><rect width=\"620\" height=\"440\" fill=\"#FFFFFF\"/><line x1=\"405\" y1=\"310\" x2=\"525\" y2=\"90\" stroke=\"#A5A5A5\" stroke-width=\"5\" stroke-dasharray=\"16 12\"/><line x1=\"205\" y1=\"130\" x2=\"525\" y2=\"90\" stroke=\"#A5A5A5\" stroke-width=\"5\" stroke-dasharray=\"16 12\"/><line x1=\"85\" y1=\"350\" x2=\"371.3\" y2=\"314.2\" stroke=\"#4472C4\" stroke-width=\"9\" stroke-linecap=\"round\"/><polygon points=\"405,310 373.1,329.1 369.4,299.3\" fill=\"#4472C4\"/><line x1=\"85\" y1=\"350\" x2=\"188.7\" y2=\"159.8\" stroke=\"#4472C4\" stroke-width=\"9\" stroke-linecap=\"round\"/><polygon points=\"205,130 201.9,167.0 175.6,152.7\" fill=\"#4472C4\"/><line x1=\"85\" y1=\"350\" x2=\"495.7\" y2=\"107.3\" stroke=\"#C00000\" stroke-width=\"9\" stroke-linecap=\"round\"/><polygon points=\"525,90 503.4,120.2 488.1,94.4\" fill=\"#C00000\"/><circle cx=\"85\" cy=\"350\" r=\"13\" fill=\"#000000\"/><line x1=\"310\" y1=\"354\" x2=\"344\" y2=\"354\" stroke=\"#4472C4\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"350,354 342,349 342,359\" fill=\"#4472C4\"/><text x=\"330\" y=\"400\" font-size=\"44\" fill=\"#4472C4\" font-family=\"Carlito, Calibri, sans-serif\" font-style=\"italic\" text-anchor=\"middle\" textLength=\"42.5\" lengthAdjust=\"spacingAndGlyphs\">F<tspan font-size=\"30\" dy=\"12\">1</tspan></text><line x1=\"90\" y1=\"84\" x2=\"124\" y2=\"84\" stroke=\"#4472C4\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"130,84 122,79 122,89\" fill=\"#4472C4\"/><text x=\"110\" y=\"130\" font-size=\"44\" fill=\"#4472C4\" font-family=\"Carlito, Calibri, sans-serif\" font-style=\"italic\" text-anchor=\"middle\" textLength=\"42.5\" lengthAdjust=\"spacingAndGlyphs\">F<tspan font-size=\"30\" dy=\"12\">2</tspan></text><line x1=\"235\" y1=\"149\" x2=\"269\" y2=\"149\" stroke=\"#C00000\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"275,149 267,144 267,154\" fill=\"#C00000\"/><text x=\"255\" y=\"195\" font-size=\"44\" fill=\"#C00000\" font-family=\"Carlito, Calibri, sans-serif\" font-style=\"italic\" text-anchor=\"middle\" textLength=\"74.1\" lengthAdjust=\"spacingAndGlyphs\">F<tspan font-size=\"30\" dy=\"12\">res</tspan></text></svg>"},"GW-Ph08-25":{"f":"Was ist Kräftezerlegung?","a":"Die Umkehrung zur Kräfteaddition: Jede Kraft lässt sich mit einem Kräfteparallelogramm in Teilkräfte zerlegen."},"GW-Ph09-01":{"f":"Nenne die mechanischen Energieformen und woran man sie erkennt.","a":"kinetische Energie – an der Geschwindigkeit · Höhenenergie – an der Höhe · Spannenergie – an der Verformung"},"GW-Ph09-02":{"f":"Formuliere das Prinzip der Energieerhaltung.","a":"Energie geht nicht verloren und entsteht nicht neu – sie wird nur umgewandelt oder übertragen. In einem abgeschlossenen System bleibt die Gesamtenergie gleich."},"GW-Ph09-03":{"f":"Was steht in einem Energieflussdiagramm über dem Pfeil, was im Rechteck?","a":"über dem Pfeil die Energieform, im Rechteck der Energiewandler"},"GW-Ph09-04":{"f":"Gib die Einheit der Energie an.","a":"Joule: <span class=\"mf\"><span class=\"up\">1</span> J<span class=\"rel\">=</span><span class=\"up\">1</span> Nm<span class=\"rel\">=</span><span class=\"up\">1</span> Ws</span>"},"GW-Ph09-05":{"f":"Wie berechnest du die Höhenenergie?","a":"<span class=\"mf\">E<sub>h</sub><span class=\"rel\">=</span>m<span class=\"bin\">·</span>g<span class=\"bin\">·</span>h</span>⁠, ab einem selbst gewählten Nullniveau"},"GW-Ph09-06":{"f":"Wie berechnest du die kinetische Energie?","a":"<span class=\"mf\">E<sub>kin</sub><span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\"><span class=\"up\">1</span></span><span class=\"n\"><span class=\"up\">2</span></span></span><span class=\"bin\">·</span>m<span class=\"bin\">·</span>v<sup><span class=\"up\">2</span></sup></span>⁠: doppeltes Tempo, vierfache Energie"},"GW-Ph09-07":{"f":"Was besagt eine Energiebilanz?","a":"Die Summe der Energien ist vorher so groß wie nachher. Damit lässt sich eine unbekannte Größe berechnen."},"GW-Ph09-08":{"f":"Was ist Arbeit, und wie berechnest du sie?","a":"Die einem Körper zugeführte oder entzogene Energie: <span class=\"mf\">W<span class=\"rel\">=</span>F<span class=\"bin\">·</span>s</span>⁠. Nur die Kraft in Wegrichtung zählt."},"GW-Ph09-09":{"f":"Warum ist die Hubarbeit wegunabhängig?","a":"Für das Heben um <span class=\"mf ik\">h</span> gilt immer <span class=\"mf\">W<span class=\"rel\">=</span>m<span class=\"bin\">·</span>g<span class=\"bin\">·</span>h</span>⁠: über eine Rampe weniger Kraft, dafür längerer Weg."},"GW-Ph09-10":{"f":"Was ist Leistung, und wie berechnest du sie?","a":"Energie pro Zeit: <span class=\"mf\">P<span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\">W</span><span class=\"n\">t</span></span></span>⁠, Einheit Watt, <span class=\"mf\"><span class=\"up\">1</span> W<span class=\"rel\">=</span><span class=\"up\">1</span> <span class=\"frac\"><span class=\"z\">J</span><span class=\"n\">s</span></span></span>"},"GW-Ph09-11":{"f":"Worin unterscheiden sich Kraft, Energie, Arbeit und Leistung?","a":"Die Kraft wirkt auf einen Körper, die Energie steckt in ihm, Arbeit ist übertragene Energie, Leistung die dafür gebrauchte Zeit."},"GW-Ph09-12":{"f":"Was ist die Elementarladung?","a":"<span class=\"mf\">e<span class=\"rel\">=</span><span class=\"up\">1</span><span class=\"up\">,</span><span class=\"up\">602</span><span class=\"bin\">·</span><span class=\"up\">10</span><sup><span class=\"vor\">−</span><span class=\"up\">19</span></sup> C</span>⁠: jede Ladung ist ein Vielfaches davon; Elektron <span class=\"mf\"><span class=\"vor\">−</span>e</span>⁠, Proton <span class=\"mf\"><span class=\"vor\">+</span>e</span>"},"GW-Ph09-13":{"f":"Wie hängen Ladung und Stromstärke zusammen?","a":"<span class=\"mf\">Q<span class=\"rel\">=</span>I<span class=\"bin\">·</span>t</span>⁠; Einheit Coulomb, <span class=\"mf\"><span class=\"up\">1</span> C<span class=\"rel\">=</span><span class=\"up\">1</span> As</span>"},"GW-Ph09-15":{"f":"Wie berechnest du die elektrische Energie?","a":"<span class=\"mf\">E<span class=\"rel\">=</span>U<span class=\"bin\">·</span>I<span class=\"bin\">·</span>t</span>"},"GW-Ph09-16":{"f":"Wie berechnest du die elektrische Leistung?","a":"<span class=\"mf\">P<span class=\"rel\">=</span>U<span class=\"bin\">·</span>I</span>"},"GW-Ph09-17":{"f":"Was ist der Wirkungsgrad?","a":"<span class=\"mf\">η<span class=\"rel\">=</span><span class=\"frac\"><span class=\"z\">E<sub>genutzt</sub></span><span class=\"n\">E<sub>zugeführt</sub></span></span></span>⁠: immer kleiner als 1, ein Teil wird stets entwertet."},"GW-Ph09-18":{"f":"Was besagt das Photonenmodell des Lichts?","a":"Licht besteht aus Photonen – einzelnen Energieportionen, die nur ganz aufgenommen oder ganz abgegeben werden."},"GW-Ph09-19":{"f":"Wie hängen Farbe und Photonenenergie zusammen?","a":"Zum blauen Ende des Spektrums hin wächst die Photonenenergie: rotes Licht trägt die kleinste, violettes die größte."},"GW-Ph09-20":{"f":"Wo liegen Ultraviolett- und Infrarotstrahlung, und warum ist UV gefährlich?","a":"UV jenseits von Violett, IR jenseits von Rot. UV-Photonen tragen mehr Energie als sichtbares Licht und können Moleküle zerstören – Sonnenbrand und Augenschäden."},"GW-Ph09-21":{"f":"Worin unterscheiden sich kontinuierliches und diskretes Spektrum?","a":"Kontinuierlich: alle Farben lückenlos, von einem glühenden Körper. Diskret: nur einzelne Linien, von einem angeregten Gas."},"GW-Ph09-22":{"f":"Was besagt das Energiestufenmodell des Atoms?","a":"Ein Atom kann nur bestimmte, diskrete Energiestufen einnehmen – Werte dazwischen gibt es nicht."},"GW-Ph09-23":{"f":"Was geschieht bei Absorption und Emission?","a":"Absorption: Das Atom nimmt ein Photon auf und steigt auf eine höhere Stufe. Emission: Es fällt zurück und sendet ein Photon aus. Dessen Energie ist die Differenz der beiden Stufen."},"GW-Ph09-24":{"f":"Warum zeigt ein Gas genau die Linien, die es auch verschluckt?","a":"Weil dieselben Energiestufen dahinterstehen: Aufgenommen und ausgesandt wird nur, was zu einer Stufendifferenz passt."},"GW-Ph09-25":{"f":"Was ist die Temperatur im Teilchenmodell?","a":"Ein Maß für die <strong>mittlere kinetische Energie</strong> der Teilchen."},"GW-Ph09-26":{"f":"Was ist der absolute Nullpunkt, und wie rechnest du in Kelvin um?","a":"<span class=\"mf\"><span class=\"up\">0</span> K<span class=\"rel\">=</span><span class=\"vor\">−</span><span class=\"up\">273</span> <span class=\"up\">°</span>C</span>⁠. Dort ist die mittlere kinetische Energie der Teilchen null, tiefer geht es nicht.<br>Umrechnung: <span class=\"mf\">T<span class=\"rel\">=</span>ϑ<span class=\"bin\">+</span><span class=\"up\">273</span></span>⁠, mit <span class=\"mf ik\">T</span> in <span class=\"mf ik\">K</span> und <span class=\"mf ik\">ϑ</span> in <span class=\"mf\"><span class=\"up\">°</span>C</span>"},"GW-Ph09-27":{"f":"Was ist die innere Energie?","a":"Die Summe der kinetischen und potentiellen Energien aller Teilchen eines Körpers."},"GW-Ph09-28":{"f":"Was passiert mit der Energie beim Wechsel des Aggregatzustands?","a":"Sie wird als <strong>potentielle</strong> Energie der Teilchen aufgenommen (Schmelzen, Verdampfen) oder abgegeben (Erstarren, Kondensieren). Die Temperatur ändert sich dabei nicht."},"GW-Ph09-29":{"f":"Gib Formelzeichen, Einheit und Bedeutung des <strong>Drucks</strong> an.","a":"<span class=\"mf\">p</span>⁠, Pascal (Pa) – Kraft je Fläche, <span class=\"mf\"><span class=\"up\">1</span> Pa<span class=\"rel\">=</span><span class=\"up\">1</span> <span class=\"frac\"><span class=\"z\">N</span><span class=\"n\">m<sup><span class=\"up\">2</span></sup></span></span></span>"},"GW-Ph09-30":{"f":"Wie erklärt das Teilchenmodell den Druck eines Gases, und wovon hängt er ab?","a":"Die Teilchen stoßen auf die Wand; jeder Stoß übt eine Kraft aus. Kleineres Volumen oder höhere Temperatur bedeuten mehr bzw. heftigere Stöße – der Druck steigt."},"GW-Ph09-31":{"f":"Womit beschreibst du den Zustand eines Gases?","a":"Mit Druck, Temperatur und Volumen."},"GW-Ph09-32":{"f":"Was setzt einen Teilchenstrom in Gang?","a":"Ein <strong>Druckunterschied</strong> – die Teilchen strömen vom höheren zum niedrigeren Druck."},"GW-Ph09-33":{"f":"Was ist Wärme, und wie grenzt sie sich von der Arbeit ab?","a":"Beide übertragen Energie und ändern die innere Energie: Wärme wegen eines <strong>Temperaturunterschieds</strong>, Arbeit über eine Kraft längs eines Weges. Ein Körper <em>hat</em> keine Wärme – er hat innere Energie."},"GW-Ph09-34":{"f":"Was gibt die spezifische Wärmekapazität an, und wie berechnest du die Wärme?","a":"<span class=\"mf ik\">c</span> ist die Energie, die 1 kg eines Stoffes um 1 K erwärmt: <span class=\"mf\">Q<span class=\"rel\">=</span>c<span class=\"bin\">·</span>m<span class=\"bin\">·</span>ΔT</span>⁠. Wasser: <span class=\"mf\">c<span class=\"rel\">=</span><span class=\"up\">4</span><span class=\"up\">,</span><span class=\"up\">2</span> <span class=\"frac\"><span class=\"z\">kJ</span><span class=\"n\">kg<span class=\"bin\">·</span>K</span></span></span>"},"GW-Ph09-35":{"f":"Was setzt einen Energiestrom in Gang?","a":"Ein <strong>Temperaturunterschied</strong> – Energie fließt stets vom wärmeren zum kälteren Körper."},"GW-Ph09-36":{"f":"Nenne die drei Arten des thermischen Energietransports.","a":"<strong>Wärmeleitung</strong> – im Stoff von Teilchen zu Teilchen · <strong>Konvektion</strong> – mit strömender Flüssigkeit oder strömendem Gas · <strong>Wärmestrahlung</strong> – als Photonen, auch durch das Vakuum"},"GW-Ph10-04":{"f":"Wozu dienen magnetische Feldlinien?","a":"Zur Veranschaulichung von Magnetfeldern."},"GW-Ph10-05":{"f":"Wie verlaufen magnetische Feldlinien?","a":"Geschlossen, außerhalb vom Nord- zum Südpol."},"GW-Ph10-06":{"f":"Was kennzeichnet ein homogenes Magnetfeld, und wo findest du eines?","a":"Die Feldlinien verlaufen parallel – etwa im Hufeisenmagneten oder in einer Spule."},"GW-Ph10-42":{"f":"Wie sieht das Feldlinienbild der Erde aus?","a":"Wie das eines Stabmagneten."},"GW-Ph10-07":{"f":"Was zeigt der Oersted-Versuch?","a":"Eine Magnetnadel unter einem stromdurchflossenen Leiter schlägt aus: Der Leiter erzeugt ein Magnetfeld, dessen Feldlinien konzentrische Kreise bilden."},"GW-Ph10-08":{"f":"Wozu dient die Rechte-Faust-Regel?","a":"Sie gibt die Richtung der Feldlinien um einen stromdurchflossenen Leiter an."},"GW-Ph10-09":{"f":"Was ist die Lorentzkraft?","a":"Die Kraft, die auf bewegte geladene Teilchen im Magnetfeld wirkt."},"GW-Ph10-10":{"f":"Wofür stehen die drei Finger bei der Drei-Finger-Regel?","a":"Daumen: Elektronenbewegung (linke Hand) bzw. technische Stromrichtung (rechte) · Zeigefinger: Magnetfeldlinien · Mittelfinger: Lorentzkraft"},"GW-Ph10-11":{"f":"Worauf beruht ein Elektromotor?","a":"Auf der Lorentzkraft an einem drehbar gelagerten stromdurchflossenen Leiter bzw. einer Spule im Magnetfeld."},"GW-Ph10-12":{"f":"Was ist eine Induktionsspannung?","a":"Die Spannung an den Enden eines Leiters oder einer Spule, wenn sich das umfassende Magnetfeld ändert."},"GW-Ph10-13":{"f":"Was ist Bewegungsinduktion?","a":"Das Magnetfeld wird durch Bewegung geändert."},"GW-Ph10-14":{"f":"Was ist Ruheinduktion?","a":"Das Magnetfeld wird ohne Bewegung geändert."},"GW-Ph10-15":{"f":"Formuliere die Regel von Lenz.","a":"Der Induktionsstrom ist immer so gerichtet, dass er seiner Ursache entgegenwirkt."},"GW-Ph10-43":{"f":"Worauf beruht ein Generator, und wie funktioniert er?","a":"Auf der Induktion: Eine Spule wird im Magnetfeld gedreht, dadurch ändert sich das umfasste Magnetfeld ständig und es wird eine Spannung induziert – eine Wechselspannung. Er ist die Umkehrung des Elektromotors."},"GW-Ph10-44":{"f":"Wie ist ein Transformator aufgebaut, und wie arbeitet er?","a":"Zwei Spulen auf einem gemeinsamen Eisenkern. Die Wechselspannung an der Primärspule erzeugt ein sich änderndes Magnetfeld; der Eisenkern führt es zur Sekundärspule, wo es eine Spannung induziert. Mit Gleichspannung arbeitet er nicht."},"GW-Ph10-01":{"f":"Gib Formelzeichen, Einheit und Bedeutung des <strong>Impulses</strong> an.","a":"<span class=\"mf\">p</span>⁠, Newtonsekunde (Ns) – Bewegungszustand eines Objekts, umgangssprachlich „Wucht&quot;"},"GW-Ph10-16":{"f":"Warum ist der Impuls eine vektorielle Größe?","a":"Er hat Betrag <strong>und</strong> Richtung."},"GW-Ph10-22":{"f":"Worin unterscheiden sich Wechselwirkungsgesetz und Kräftegleichgewicht?","a":"Beide Male zwei gleich große entgegengesetzte Kräfte. Beim Kräftegleichgewicht wirken sie auf <strong>denselben</strong> Körper und rufen einander nicht hervor."},"GW-Ph10-18":{"f":"Was gilt beim Stoß für Impuls und Energie?","a":"Der Impuls vor dem Stoß ist so groß wie danach. Die kinetische Energie vorher entspricht der kinetischen Energie plus der inneren Energie nachher."},"GW-Ph10-19":{"f":"Was kennzeichnet den vollkommen unelastischen Stoß?","a":"Beide Körper bewegen sich danach zusammen mit gleicher Geschwindigkeit weiter."},"GW-Ph10-20":{"f":"Was kennzeichnet den elastischen Stoß?","a":"Es tritt keine innere Energie auf."},"GW-Ph10-21":{"f":"Was ist beim nicht-zentralen Stoß zu beachten?","a":"Die Körper bewegen sich danach unter einem Winkel auseinander – im Impulserhaltungssatz muss die Richtung der Impulse berücksichtigt werden."},"GW-Ph10-27":{"f":"Was ist eine gleichförmige Bewegung?","a":"Eine Bewegung mit konstanter Geschwindigkeit."},"GW-Ph10-23":{"f":"Was gibt die Steigung im t-s-Diagramm an?","a":"Die Geschwindigkeit."},"GW-Ph10-24":{"f":"Was geben Steigung und Fläche im t-v-Diagramm an?","a":"Steigung die Beschleunigung, Fläche die Strecke."},"GW-Ph10-25":{"f":"Was gibt die Fläche im t-a-Diagramm an?","a":"Die Geschwindigkeits<strong>änderung</strong> <span class=\"mf\">Δv</span>⁠, nicht die Geschwindigkeit selbst."},"GW-Ph10-26":{"f":"Was bedeuten negative Geschwindigkeit und negative Beschleunigung?","a":"Rückwärtsfahren bzw. Bremsen."},"GW-Ph10-29":{"f":"Beschreibe den waagrechten Wurf.","a":"Zweidimensional: konstante Geschwindigkeit in x-Richtung, konstante Beschleunigung in y-Richtung."},"GW-Ph10-30":{"f":"Was sind Isotope?","a":"Atome desselben Elements, die sich in der Neutronenzahl unterscheiden."},"GW-Ph10-31":{"f":"Wie ist die Symbolschreibweise für Nuklide aufgebaut?","a":"Massenzahl oben, Kernladungszahl unten links vor dem Elementsymbol."},"GW-Ph10-32":{"f":"Was sind die kleinsten bisher bekannten Bausteine der Materie?","a":"Quarks und Leptonen."},"GW-Ph10-33":{"f":"Was macht radioaktive Strahlung mit Materie?","a":"Sie ionisiert sie."},"GW-Ph10-38":{"f":"Worin unterscheiden sich die drei Strahlungsarten?","a":"In Abschirmbarkeit, Reichweite und Verhalten im Magnetfeld."},"GW-Ph10-34":{"f":"Womit weist du radioaktive Strahlung nach?","a":"Nebelkammer – sichtbar machen · Geiger-Müller-Zählrohr – messen"},"GW-Ph10-02":{"f":"Gib Formelzeichen, Einheit und Bedeutung der <strong>Aktivität</strong> an.","a":"<span class=\"mf\">A</span>⁠, Becquerel (Bq) – Anzahl der Zerfälle pro Zeiteinheit"},"GW-Ph10-03":{"f":"Gib Formelzeichen, Einheit und Bedeutung der <strong>Halbwertszeit</strong> an.","a":"<span class=\"mf\">T<sub><span class=\"up\">1/2</span></sub></span>⁠, Sekunde (s) – Zeit, nach der die Anzahl radioaktiver Kerne bzw. die Aktivität halbiert ist"},"GW-Ph10-39":{"f":"Was passiert bei Kernspaltung und Kernfusion mit der Masse?","a":"Ein Teil der Masse wird in Energie umgewandelt."},"GW-Ph11-01":{"f":"Was kennzeichnet eine gleichförmige Kreisbewegung?","a":"Der <strong>Betrag</strong> der Geschwindigkeit bleibt gleich, ihre <strong>Richtung</strong> ändert sich ständig. Die Bewegung ist deshalb beschleunigt, obwohl das Tempo konstant bleibt."},"GW-Ph11-02":{"f":"Worin unterscheiden sich Bahn- und Winkelgeschwindigkeit?","a":"Die Bahngeschwindigkeit ist die auf der Kreisbahn zurückgelegte Strecke pro Zeit und hängt vom Radius ab. Die Winkelgeschwindigkeit ist der überstrichene Winkel pro Zeit und ist für alle Punkte eines starren Körpers gleich."},"GW-Ph11-03":{"f":"Wohin zeigt die Zentripetalkraft, und was bewirkt sie?","a":"Immer zum Mittelpunkt der Kreisbahn. Sie ändert nur die <strong>Richtung</strong> der Geschwindigkeit, nicht ihren Betrag."},"GW-Ph11-04":{"f":"Ist die Zentripetalkraft eine eigene Kraftart?","a":"Nein, sie ist eine <strong>Rolle</strong>. Bei jeder Kreisbewegung übernimmt sie eine vorhandene Kraft – die Seilkraft, die Reibung, die Gravitationskraft oder die Normalkraft."},"GW-Ph11-05":{"f":"Was ist die Zentrifugalkraft?","a":"Eine <strong>Scheinkraft</strong>: Sie tritt nur im mitrotierenden Bezugssystem auf. Im ruhenden System gibt es sie nicht."},"GW-Ph11-06":{"f":"Was geschieht, wenn die Zentripetalkraft plötzlich wegfällt?","a":"Der Körper bewegt sich geradlinig <strong>tangential</strong> weiter – nach außen geschleudert wird er nicht."},"GW-Ph11-07":{"f":"Was besagt das Newtonsche Gravitationsgesetz?","a":"Je zwei Massen ziehen einander an, beide gleich stark. Die Anziehung wächst mit den Massen und nimmt mit wachsendem Abstand rasch ab."},"GW-Ph11-08":{"f":"Warum bleibt ein Satellit auf seiner Kreisbahn?","a":"Die Gravitationskraft übernimmt die Rolle der Zentripetalkraft: Sie zieht den Satelliten ständig zum Zentralkörper und krümmt seine Bahn zum Kreis."},"GW-Ph11-09":{"f":"Was ist eine mechanische Schwingung?","a":"Eine periodische Bewegung um eine Ruhelage."},"GW-Ph11-10":{"f":"Welche zwei Bedingungen braucht ein schwingungsfähiges System?","a":"Eine zur Ruhelage <strong>rücktreibende</strong> Kraft und die <strong>Trägheit</strong>, die den Körper über die Ruhelage hinausträgt."},"GW-Ph11-11":{"f":"Was geschieht während einer Schwingung mit der Energie?","a":"Sie pendelt zwischen potentieller und kinetischer Energie: in den Umkehrpunkten ganz potentiell, beim Durchgang durch die Ruhelage ganz kinetisch."},"GW-Ph11-12":{"f":"Was kennzeichnet eine harmonische Schwingung?","a":"Ihr zeitlicher Verlauf ist eine <strong>Sinuskurve</strong>. Das ist genau dann der Fall, wenn die rücktreibende Kraft proportional zur Auslenkung wächst."},"GW-Ph11-13":{"f":"Nenne Amplitude, Periodendauer und Frequenz einer Schwingung.","a":"Amplitude – die größte Auslenkung · Periodendauer – die Dauer einer vollen Schwingung · Frequenz – die Anzahl der Schwingungen je Sekunde"},"GW-Ph11-14":{"f":"Wovon hängt die Schwingungsdauer eines Fadenpendels ab – und wovon nicht?","a":"Nur von der Pendellänge und vom Ortsfaktor. <strong>Nicht</strong> von der Masse und – bei kleinen Auslenkungen – nicht von der Amplitude."},"GW-Ph11-15":{"f":"Wovon hängt die Schwingungsdauer eines Federpendels ab?","a":"Von der Masse und von der Federhärte, <strong>nicht</strong> von der Amplitude."},"GW-Ph11-16":{"f":"Was überträgt eine Welle – und was nicht?","a":"Energie, aber keine Materie: Die Teilchen schwingen nur um ihre Ruhelage."},"GW-Ph11-17":{"f":"Worin unterscheiden sich Longitudinal- und Transversalwelle?","a":"Longitudinal schwingen die Teilchen <strong>längs</strong> der Ausbreitungsrichtung (Schall in Luft), transversal <strong>quer</strong> dazu (Seilwelle, Licht)."},"GW-Ph11-18":{"f":"Was ist Beugung?","a":"Eine Welle läuft hinter einem Hindernis oder einer engen Öffnung in den geometrischen Schattenraum hinein."},"GW-Ph11-19":{"f":"Was besagt das Superpositionsprinzip?","a":"Treffen zwei Wellen zusammen, addieren sich in jedem Punkt ihre Auslenkungen. Danach läuft jede unverändert weiter."},"GW-Ph11-20":{"f":"Was ist der Gangunterschied, und wann verstärken, wann löschen sich zwei Wellen?","a":"Der Unterschied der bis zu einem Punkt zurückgelegten Wege. Bei einem <strong>ganzzahligen</strong> Vielfachen der Wellenlänge verstärken sie sich (konstruktiv), bei einem <strong>ungeraden Vielfachen der halben</strong> Wellenlänge löschen sie sich aus (destruktiv)."},"GW-Ph11-21":{"f":"Was kennzeichnet eine stehende Welle?","a":"Zwei gegenläufige Wellen überlagern sich. Es entstehen ortsfeste <strong>Knoten</strong>, die stets in Ruhe bleiben, und <strong>Bäuche</strong> mit größter Auslenkung."},"GW-Ph11-22":{"f":"Was zeigt monochromatisches Licht am Doppelspalt, und was folgt daraus?","a":"Ein Muster aus hellen und dunklen Streifen auf dem Schirm. Da nur Wellen einander auslöschen können, lässt sich Licht mit dem Wellenmodell beschreiben."},"GW-Ph11-23":{"f":"Wie hängen Farbe und Wellenlänge des Lichts zusammen?","a":"Rotes Licht hat die größte, violettes die kleinste Wellenlänge des sichtbaren Bereichs."},"GW-Ph11-24":{"f":"Wann brauchst du das Wellen-, wann das Photonenmodell des Lichts?","a":"Das Wellenmodell bei Beugung und Interferenz, das Photonenmodell bei Aufnahme und Abgabe von Energie in Portionen. Beides sind Modelle – keines ist „das richtige“."},"GW-Ph11-25":{"f":"Worin unterscheiden sich geozentrisches und heliozentrisches Weltbild?","a":"Geozentrisch steht die Erde im Mittelpunkt. Heliozentrisch steht die Sonne im Mittelpunkt, und die Erde ist einer der Planeten."},"GW-Ph11-26":{"f":"Warum setzte sich das heliozentrische Weltbild durch?","a":"Weil sich damit neue Beobachtungen einfacher erklären ließen. Ein physikalisches Weltbild gilt so lange, bis Beobachtungen es widerlegen."},"GW-Ph11-27":{"f":"Was ist ein Inertialsystem?","a":"Ein Bezugssystem, in dem das Trägheitsgesetz gilt – also ein unbeschleunigtes System."},"GW-Ph11-28":{"f":"Nenne die beiden Einsteinschen Postulate.","a":"<strong>Relativitätsprinzip:</strong> In allen Inertialsystemen gelten dieselben physikalischen Gesetze. <strong>Konstanz der Lichtgeschwindigkeit:</strong> Licht hat im Vakuum in jedem Inertialsystem dieselbe Geschwindigkeit – unabhängig davon, wie sich Quelle und Beobachter bewegen."},"GW-Ph11-29":{"f":"Was besagt die Zeitdilatation?","a":"Eine bewegte Uhr geht langsamer als eine im eigenen System ruhende – gemessen von dem System aus, in dem sie sich bewegt."},"GW-Ph11-30":{"f":"Was besagt die Längenkontraktion?","a":"Ein bewegter Körper ist in Bewegungsrichtung kürzer als in seinem Ruhesystem – gemessen von dem System aus, in dem er sich bewegt."},"GW-Ph11-31":{"f":"Was besagt die Relativität der Gleichzeitigkeit?","a":"Zwei Ereignisse, die in einem Inertialsystem gleichzeitig sind, müssen es in einem dazu bewegten nicht sein."},"GW-Ph11-32":{"f":"Wo hat die klassische Mechanik ihre Grenze?","a":"Bei Geschwindigkeiten nahe der Lichtgeschwindigkeit. Weit darunter stimmen ihre Ergebnisse mit denen der Relativitätstheorie praktisch überein."},"GW-Ph11-33":{"f":"Worin unterscheiden sich reversible und irreversible Vorgänge?","a":"Ein reversibler Vorgang ließe sich vollständig rückgängig machen, ohne dass etwas zurückbleibt. Ein irreversibler nicht – und alle wirklichen Vorgänge sind irreversibel."},"GW-Ph11-34":{"f":"Was ist Energieentwertung?","a":"Energie geht nie verloren, wird aber immer weniger nutzbar: Bei jedem irreversiblen Vorgang wird ein Teil in innere Energie umgewandelt und ist nicht mehr vollständig zurückzugewinnen."},"GW-Ph11-35":{"f":"Warum ist der Wirkungsgrad eines Wärmekraftwerks grundsätzlich begrenzt?","a":"Weil sich innere Energie nicht vollständig in nutzbare Energie zurückverwandeln lässt. Ein Teil muss stets als Abwärme abgegeben werden."},"GW-Ph11-36":{"f":"Nach welchen Kriterien vergleichst du Energiequellen?","a":"Wirkungsgrad, Verfügbarkeit der Ressource, Auswirkungen auf die Umwelt, Kosten und Speicherbarkeit."}},"fertigkeiten":{"F-Ph07-01":{"kann":"Ich berechne einfache Terme mit dem Taschenrechner und wandle zwischen Bruch und Dezimalzahl um.","weg":"Zwischen Bruch und Dezimalzahl schaltet die S⇔D-Taste um.","varianten":[{"auftrag":"Rechne mit dem Taschenrechner: <span class=\"mf ik\"><span class=\"frac\"><span class=\"z\"><span class=\"up\">3</span></span><span class=\"n\"><span class=\"up\">8</span></ <script>
"use strict";
const $ = (id) => document.getElementById(id);
const SCHLUESSEL = "gw-" + DATEN.fach.toLowerCase() + "-v1";
const INTERVALL = [1, 1, 2, 4, 8, 16];   // Tage je Leitner-Fach (0 = neu)

/* ------------------------------------------------------------- Lernstand */
function heute(){ const d = new Date(); d.setHours(0,0,0,0); return Math.floor(d/86400000); }
function leer(){ return {gewaehlt:[], karten:{}}; }
function laden(){
  try{ const r = localStorage.getItem(SCHLUESSEL);
       if(!r) return leer();
       const s = JSON.parse(r);
       return {gewaehlt: s.gewaehlt || [], karten: s.karten || {}};
  }catch(e){ return leer(); }
}
function sichern(){ try{ localStorage.setItem(SCHLUESSEL, JSON.stringify(stand)); }catch(e){} }
let stand = laden();

/* --------------------------------------------------------------- Auswahl */
const kapitelListe = [];      // {schluessel, jgst, titel, farbe, saetze[], kompetenzen[]}
DATEN.jahrgaenge.forEach(j => j.kapitel.forEach(k => kapitelListe.push(
  Object.assign({schluessel: j.jgst + "/" + k.titel, jgst: j.jgst}, k))));

function gewaehlteKapitel(){
  return kapitelListe.filter(k => stand.gewaehlt.includes(k.schluessel));
}
function pool(art){
  const n = [];
  gewaehlteKapitel().forEach(k => k[art].forEach(x => { if(!n.includes(x)) n.push(x); }));
  return n;
}
function faellig(nummern){
  const h = heute();
  return nummern.filter(nr => !stand.karten[nr] || stand.karten[nr].faellig <= h);
}

function auswahlZeichnen(){
  const ziel = $("jahrgaenge");
  ziel.innerHTML = "";
  DATEN.jahrgaenge.forEach(j => {
    const block = document.createElement("div");
    block.className = "jahrgang";
    block.innerHTML = "<h2>" + j.jgst.replace(/^0/,"") + ". Jahrgangsstufe</h2>";
    const liste = document.createElement("div");
    liste.className = "kapitelliste";
    j.kapitel.forEach(k => {
      const schluessel = j.jgst + "/" + k.titel;
      const an = stand.gewaehlt.includes(schluessel);
      const zeile = document.createElement("label");
      zeile.className = "kapitel" + (an ? " an" : "");
      const anzahl = k.saetze.length + k.kompetenzen.length;
      zeile.innerHTML =
        '<input type="checkbox"' + (an ? " checked" : "") + '>' +
        '<span class="punkt farbton" style="background:#' + k.farbe + '"></span>' +
        '<span class="name">' + k.titel + '</span>' +
        '<span class="zahl">' + anzahl + '</span>' +
        '<span class="haken">✓</span>';
      zeile.querySelector("input").addEventListener("change", (e) => {
        if(e.target.checked){ if(!stand.gewaehlt.includes(schluessel)) stand.gewaehlt.push(schluessel); }
        else { stand.gewaehlt = stand.gewaehlt.filter(s => s !== schluessel); }
        zeile.classList.toggle("an", e.target.checked);
        sichern(); zahlenAuffrischen();
      });
      liste.appendChild(zeile);
    });
    block.appendChild(liste);
    ziel.appendChild(block);
  });
}

function zahlenAuffrischen(){
  [["satz","startSaetze","zahlSaetze"],["kompetenz","startKompetenzen","zahlKompetenzen"]]
  .forEach(([art, knopf, zahl]) => {
    const alle = pool(art === "satz" ? "saetze" : "kompetenzen");
    const dran = faellig(alle);
    $(zahl).textContent = alle.length === 0 ? "–"
        : dran.length === 0 ? "heute durch" : dran.length + " von " + alle.length;
    $(knopf).disabled = alle.length === 0;
  });
}

/* ----------------------------------------------------------------- Runde */
let runde = null;
const zuletzt = {};   // Nr -> zuletzt gezeigte Variante, damit sie nicht folgt

function mischen(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function starten(art, alleStatt){
  const alle = pool(art === "satz" ? "saetze" : "kompetenzen");
  const nummern = alleStatt ? alle : faellig(alle);
  if(nummern.length === 0){ schlussZeigen(art, alle); return; }
  runde = {art, karten: mischen(nummern.slice()), gesamt: nummern.length, fertig: 0};
  zeigen("uebung");
  naechste();
}
function naechste(){
  if(runde.karten.length === 0){ schlussZeigen(runde.art, pool(runde.art === "satz" ? "saetze" : "kompetenzen")); return; }
  const nr = runde.karten[0];
  const kap = kapitelListe.find(k => k.saetze.includes(nr) || k.kompetenzen.includes(nr));
  $("band").style.background = "#" + kap.farbe;
  $("herkunft").textContent = kap.titel;
  $("herkunft").style.color = "#" + kap.farbe;

  const antwort = $("antwort");
  antwort.hidden = true; antwort.innerHTML = "";
  $("knopfAuf").hidden = false; $("knopfWert").hidden = true;

  if(runde.art === "satz"){
    const s = DATEN.saetze[nr];
    $("kann").hidden = true;
    $("frage").innerHTML = s.f;
    antwort.innerHTML = '<div class="ergebnis">' + s.a + '</div>';
  } else {
    const f = DATEN.fertigkeiten[nr];
    let i = Math.floor(Math.random() * f.varianten.length);
    if(f.varianten.length > 1 && i === zuletzt[nr]) i = (i + 1) % f.varianten.length;
    zuletzt[nr] = i;
    const v = f.varianten[i];
    $("kann").hidden = false;
    $("kann").innerHTML = f.kann;
    $("frage").innerHTML = v.auftrag;
    antwort.innerHTML = '<p class="weg">' + (v.weg || f.weg) + '</p>' +
                        '<div class="ergebnis">' + v.ergebnis + '</div>';
  }
  $("rest").textContent = "noch " + runde.karten.length;
  $("fortschritt").style.width = (100 * runde.fertig / Math.max(1, runde.gesamt)) + "%";
  window.scrollTo({top:0, behavior:"instant"});
}
function aufdecken(){
  if(!runde || $("knopfAuf").hidden) return;
  $("antwort").hidden = false;
  $("knopfAuf").hidden = true; $("knopfWert").hidden = false;
}
function bewerten(gut){
  if(!runde || $("knopfWert").hidden) return;
  const nr = runde.karten.shift();
  const k = stand.karten[nr] || {fach:0};
  if(gut){
    k.fach = Math.min(5, k.fach + 1);
    k.faellig = heute() + INTERVALL[k.fach];
    runde.fertig++;
  } else {
    k.fach = 1;
    k.faellig = heute();
    runde.karten.push(nr);          // in dieser Runde noch einmal
  }
  stand.karten[nr] = k;
  sichern();
  naechste();
}
function schlussZeigen(art, alle){
  const offen = alle.length - faellig(alle).length;
  $("schlussTitel").textContent = "Für heute durch.";
  $("schlussText").textContent = alle.length === 0 ? "Kein Kapitel ausgewählt."
      : offen + " von " + alle.length + (offen === 1 ? " Karte sitzt" : " Karten sitzen")
        + " – sie kommen in den nächsten Tagen wieder dran.";
  $("zahlWeiter").textContent = alle.length + " Karten";
  $("nochRunde").onclick = () => starten(art, true);
  zeigen("schluss");
}
function zeigen(welche){
  ["auswahl","uebung","schluss"].forEach(s => $(s).hidden = (s !== welche));
  if(welche === "auswahl") zahlenAuffrischen();
}

/* ------------------------------------------------------------- Verdrahten */
$("startSaetze").onclick = () => starten("satz", false);
$("startKompetenzen").onclick = () => starten("kompetenz", false);
$("aufdecken").onclick = aufdecken;
$("nochmal").onclick = () => bewerten(false);
$("gewusst").onclick = () => bewerten(true);
$("zurueck").onclick = () => zeigen("auswahl");
$("zurAuswahl").onclick = () => zeigen("auswahl");
document.querySelectorAll("[data-alle]").forEach(b => b.onclick = () => {
  stand.gewaehlt = b.dataset.alle === "1" ? kapitelListe.map(k => k.schluessel) : [];
  sichern(); auswahlZeichnen(); zahlenAuffrischen();
});
$("zuruecksetzen").onclick = () => {
  if(!confirm("Lernstand und Auswahl auf diesem Gerät löschen?")) return;
  try{ localStorage.removeItem(SCHLUESSEL); }catch(e){}
  stand = leer(); auswahlZeichnen(); zahlenAuffrischen(); zeigen("auswahl");
};
document.addEventListener("keydown", (e) => {
  if($("uebung").hidden) return;
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); aufdecken(); }
  else if(e.key === "1"){ bewerten(false); }
  else if(e.key === "2"){ bewerten(true); }
});

/* --------------------------------------------------------- Adresse lesen */
// Der QR-Code eines Blatts bringt sein Kapitel mit: '#kapitel=07/Optik' oder
// '#jgst=07;08'. Was dort steht, ersetzt die gespeicherte Auswahl - wer den
// Code des Optikblatts scannt, will Optik üben, nicht das vom letzten Mal.
function ausDerAdresse(){
  const h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if(!h) return null;
  const [feld, wert] = h.split("=");
  if(!wert) return null;
  const teile = wert.split(";").map(s => s.trim()).filter(Boolean);
  let treffer = [];
  if(feld === "k") treffer = kapitelListe.filter(k => teile.includes(k.kennung));
  else if(feld === "j") treffer = kapitelListe.filter(k => teile.includes(k.jgst));
  return treffer.length ? treffer.map(k => k.schluessel) : null;
}

/* ------------------------------------------------------------------ Start */
const ausAdresse = ausDerAdresse();
if(ausAdresse){ stand.gewaehlt = ausAdresse; sichern(); }
if(stand.gewaehlt.length === 0) stand.gewaehlt = kapitelListe.map(k => k.schluessel);
$("unterzeile").textContent = DATEN.anzahl.saetze + " Sätze und " +
  DATEN.anzahl.kompetenzen + " Kompetenzen · wähle aus, was ihr schon hattet";
$("stand").textContent = "Stand " + DATEN.stand + " · erzeugt aus dem Grundwissensregister";
if(DATEN.adresse){
  $("adresse").hidden = false;
  $("adresse").textContent = DATEN.adresse.replace(/^https?:\/\//, "");
}
auswahlZeichnen();
zahlenAuffrischen();
zeigen("auswahl");
</script>
</body>
</html>
